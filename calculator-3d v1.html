<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeForge — 3D Калькулятор Self-Storage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-scene: #1a1a1a;
            --panel-bg: rgba(255, 255, 255, 0.88);
            --panel-bg-dark: rgba(30, 30, 35, 0.92);
            --text-primary: #1a1a1e;
            --text-secondary: #5a5a65;
            --text-light: #e8e8ed;
            --accent: #FF5722;
            --accent-glow: #FF7043;
            --border: rgba(0, 0, 0, 0.06);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.18);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-scene);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-x pan-y pinch-zoom;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        #canvas-container canvas {
            display: block;
        }

        /* ── Панели ── */
        .panel {
            position: fixed;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(16px) saturate(130%);
            -webkit-backdrop-filter: blur(16px) saturate(130%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            transition: transform var(--transition), opacity var(--transition);
        }

        /* Левая панель — библиотека вещей */
        .panel-left {
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .panel-left .panel-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }
        .btn-add-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid transparent;
            border-radius: var(--radius-sm);
            background: #ffffff;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: all var(--transition);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        .btn-add-item:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(255, 87, 34, 0.15);
            transform: translateY(-1px);
        }
        .btn-add-item:active {
            transform: scale(0.97);
            transition: 0.08s;
        }
        .btn-add-item .icon-dot {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            font-weight: 700;
        }
        .btn-add-item .item-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .btn-add-item .item-name {
            font-weight: 600;
            font-size: 13px;
            line-height: 1.2;
        }
        .btn-add-item .item-volume {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .dot-box {
            background: #C4956A;
        }
        .dot-sofa {
            background: #7B8D93;
        }
        .dot-bike {
            background: #5C6B73;
        }
        .dot-fridge {
            background: #D5D8DC;
            color: #333 !important;
        }

        .btn-clear {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e0e0e5;
            border-radius: var(--radius-sm);
            background: transparent;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #999;
            transition: all var(--transition);
            margin-top: 4px;
            letter-spacing: 0.03em;
        }
        .btn-clear:hover {
            border-color: #d44;
            color: #d44;
            background: rgba(221, 68, 68, 0.04);
        }

        /* Правая панель — дашборд */
        .panel-right {
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 290px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .panel-right .panel-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        .metric-row:last-child {
            border-bottom: none;
        }
        .metric-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .metric-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            font-family: var(--font-mono);
        }
        .metric-value.accent {
            color: var(--accent);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .fill-bar-container {
            width: 100%;
            height: 8px;
            background: #e8e8ec;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 2px;
        }
        .fill-bar-fill {
            height: 100%;
            border-radius: 10px;
            background: var(--accent);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 0%;
        }
        .fill-bar-fill.warning {
            background: #ff9800;
        }
        .fill-bar-fill.danger {
            background: #e53935;
        }
        .badge-recommend {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.03em;
            background: #f0f4ff;
            color: #3b5ccc;
        }
        .badge-recommend.oversize {
            background: #fff3f0;
            color: #d84315;
        }
        .warning-text {
            font-size: 11px;
            color: #d84315;
            font-weight: 600;
            margin-top: 2px;
            line-height: 1.4;
        }

        /* ── Адаптивность ── */
        @media (max-width: 768px) {
            .panel-left {
                left: 8px;
                right: 8px;
                top: auto;
                bottom: 10px;
                transform: none;
                width: auto;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
                padding: 12px 14px;
                border-radius: 20px;
                justify-content: center;
                box-shadow: var(--shadow-lg);
            }
            .panel-left .panel-title {
                display: none;
            }
            .btn-add-item {
                width: auto;
                flex: 1 1 auto;
                min-width: 70px;
                padding: 10px 12px;
                gap: 6px;
                justify-content: center;
                font-size: 12px;
                border-radius: 14px;
            }
            .btn-add-item .icon-dot {
                width: 24px;
                height: 24px;
                font-size: 13px;
                border-radius: 6px;
            }
            .btn-add-item .item-info {
                display: none;
            }
            .btn-clear {
                width: auto;
                flex: 0 0 auto;
                padding: 10px 16px;
                font-size: 12px;
                margin-top: 0;
                border-radius: 14px;
            }
            .panel-right {
                right: 8px;
                left: 8px;
                top: 10px;
                bottom: auto;
                transform: none;
                width: auto;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px 12px;
                padding: 12px 14px;
                border-radius: 20px;
                justify-content: space-around;
                box-shadow: var(--shadow-lg);
            }
            .panel-right .panel-title {
                width: 100%;
                text-align: center;
                font-size: 11px;
                margin-bottom: 0;
            }
            .metric-row {
                border-bottom: none;
                padding: 2px 6px;
                gap: 6px;
                flex-direction: row;
                align-items: center;
            }
            .metric-label {
                font-size: 10px;
            }
            .metric-value {
                font-size: 13px;
            }
            .metric-value.accent {
                font-size: 18px;
            }
            .fill-bar-container {
                width: 100%;
                height: 5px;
                order: 10;
            }
            .badge-recommend {
                font-size: 10px;
                padding: 4px 10px;
            }
            .warning-text {
                font-size: 10px;
                width: 100%;
                text-align: center;
            }
        }
        @media (max-width: 400px) {
            .btn-add-item {
                padding: 8px 10px;
                min-width: 50px;
                font-size: 11px;
            }
            .btn-add-item .icon-dot {
                width: 20px;
                height: 20px;
                font-size: 11px;
            }
            .btn-clear {
                padding: 8px 12px;
                font-size: 11px;
            }
            .panel-left {
                padding: 8px 10px;
                gap: 5px;
                bottom: 6px;
            }
            .panel-right {
                padding: 8px 10px;
                gap: 4px 8px;
                top: 6px;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Левая панель: библиотека вещей -->
    <div class="panel panel-left" id="panel-left">
        <div class="panel-title">📦 Добавить вещь</div>
        <button class="btn-add-item" data-type="box">
            <span class="icon-dot dot-box">📦</span>
            <span class="item-info"><span class="item-name">Коробка</span><span class="item-volume">0.5×0.5×0.5 м · 0.125 м³</span></span>
        </button>
        <button class="btn-add-item" data-type="sofa">
            <span class="icon-dot dot-sofa">🛋</span>
            <span class="item-info"><span class="item-name">Диван</span><span class="item-volume">2×1×1 м · 2 м³</span></span>
        </button>
        <button class="btn-add-item" data-type="bike">
            <span class="icon-dot dot-bike">🚲</span>
            <span class="item-info"><span class="item-name">Велосипед</span><span class="item-volume">1.5×0.5×1 м · 0.75 м³</span></span>
        </button>
        <button class="btn-add-item" data-type="fridge">
            <span class="icon-dot dot-fridge">🧊</span>
            <span class="item-info"><span class="item-name">Холодильник</span><span class="item-volume">0.8×0.8×1.8 м · 1.15 м³</span></span>
        </button>
        <button class="btn-clear" id="btn-clear">🗑 Очистить сцену</button>
    </div>

    <!-- Правая панель: дашборд -->
    <div class="panel panel-right" id="panel-right">
        <div class="panel-title">📊 Дашборд</div>
        <div class="metric-row">
            <span class="metric-label">Количество вещей</span>
            <span class="metric-value" id="metric-count">0</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Суммарный объём</span>
            <span class="metric-value" id="metric-volume">0.00 м³</span>
        </div>
        <div class="metric-row" style="flex-wrap:wrap;">
            <span class="metric-label" style="width:100%;">Заполненность</span>
            <div class="fill-bar-container" style="width:100%;">
                <div class="fill-bar-fill" id="fill-bar" style="width:0%;"></div>
            </div>
            <span class="metric-value" id="metric-fill-percent" style="font-size:12px;margin-top:2px;">0%</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Рекомендуемый бокс</span>
            <span class="badge-recommend" id="badge-recommend">—</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Итоговая цена / мес</span>
            <span class="metric-value accent" id="metric-price">0 ₽</span>
        </div>
        <div id="warning-container"></div>
    </div>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { DragControls } from 'three/addons/controls/DragControls.js';

        // ─────────────────────────────────────
        // Константы и конфигурация
        // ─────────────────────────────────────
        const BOX_SIZE = 3; // Размер виртуального бокса (3x3x3 метра)
        const BOX_HALF = BOX_SIZE / 2; // 1.5 — половина для границ
        const BOX_CENTER_Y = BOX_SIZE / 2; // Центр бокса по Y (стоит на полу, пол на y=0)

        // Спецификации предметов
        const ITEM_SPECS = {
            box: {
                name: 'Коробка',
                w: 0.5,
                h: 0.5,
                d: 0.5,
                volume: 0.125,
                color: 0xC4956A,
                icon: '📦'
            },
            sofa: {
                name: 'Диван',
                w: 2,
                h: 1,
                d: 1,
                volume: 2,
                color: 0x7B8D93,
                icon: '🛋'
            },
            bike: {
                name: 'Велосипед',
                w: 1.5,
                h: 0.5,
                d: 1,
                volume: 0.75,
                color: 0x5C6B73,
                icon: '🚲'
            },
            fridge: {
                name: 'Холодильник',
                w: 0.8,
                h: 1.8,
                d: 0.8,
                volume: 1.152,
                color: 0xD5D8DC,
                icon: '🧊'
            }
        };

        // Рекомендации боксов
        const BOX_RECOMMENDATIONS = [
            { name: 'S', dims: '1×1.5×2 м', volume: 3, price: 3000, color: '#4CAF50' },
            { name: 'M', dims: '2×2×2.5 м', volume: 10, price: 7000, color: '#FF9800' },
            { name: 'L', dims: '3×3×3 м', volume: 27, price: 15000, color: '#FF5722' },
        ];

        // ─────────────────────────────────────
        // Инициализация Three.js
        // ─────────────────────────────────────
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1a1a1a');
        scene.fog = new THREE.Fog('#1a1a1a', 8, 30);

        // Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        // Камера
        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.5, 50);
        camera.position.set(6, 5.5, 8);
        camera.lookAt(0, 1.5, 0);

        // OrbitControls
        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.target.set(0, 1.5, 0);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.08;
        orbitControls.minDistance = 3;
        orbitControls.maxDistance = 16;
        orbitControls.maxPolarAngle = Math.PI * 0.75;
        orbitControls.minPolarAngle = 0.3;
        orbitControls.update();

        // ── Освещение ──
        // Ambient
        const ambientLight = new THREE.AmbientLight('#bcc8e8', 1.6);
        scene.add(ambientLight);

        // Hemisphere
        const hemiLight = new THREE.HemisphereLight('#ffffff', '#3a3040', 0.9);
        scene.add(hemiLight);

        // Directional (ключевой свет с тенями)
        const sunLight = new THREE.DirectionalLight('#ffffff', 2.8);
        sunLight.position.set(8, 12, 3);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -10;
        sunLight.shadow.camera.right = 10;
        sunLight.shadow.camera.top = 10;
        sunLight.shadow.camera.bottom = -10;
        sunLight.shadow.bias = -0.0004;
        sunLight.shadow.normalBias = 0.02;
        scene.add(sunLight);

        // ── Пол ──
        const floorGeo = new THREE.PlaneGeometry(12, 12);
        const floorMat = new THREE.MeshStandardMaterial({
            color: '#2a2a30',
            roughness: 0.55,
            metalness: 0.05,
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.01;
        floor.receiveShadow = true;
        floor.name = 'floor';
        scene.add(floor);

        // Сетка на полу (GridHelper)
        const gridHelper = new THREE.GridHelper(8, 24, '#444450', '#2e2e36');
        gridHelper.position.y = 0.0;
        scene.add(gridHelper);

        // Подложка внутри бокса (более светлая зона)
        const innerFloorGeo = new THREE.PlaneGeometry(BOX_SIZE, BOX_SIZE);
        const innerFloorMat = new THREE.MeshStandardMaterial({
            color: '#353540',
            roughness: 0.4,
            metalness: 0.08,
        });
        const innerFloor = new THREE.Mesh(innerFloorGeo, innerFloorMat);
        innerFloor.rotation.x = -Math.PI / 2;
        innerFloor.position.y = 0.005;
        innerFloor.receiveShadow = true;
        innerFloor.name = 'innerFloor';
        scene.add(innerFloor);

        // ── Виртуальный бокс (прозрачные стены + каркас) ──
        const boxGroup = new THREE.Group();
        boxGroup.name = 'virtualBox';

        // Полупрозрачные стены
        const boxGeo = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
        const boxWallMat = new THREE.MeshPhysicalMaterial({
            color: '#88aacc',
            roughness: 0.1,
            metalness: 0.0,
            transparent: true,
            opacity: 0.12,
            depthWrite: false,
            envMapIntensity: 0,
            clearcoat: 0.1,
        });
        const boxWalls = new THREE.Mesh(boxGeo, boxWallMat);
        boxWalls.position.y = BOX_CENTER_Y;
        boxWalls.name = 'boxWalls';
        boxWalls.renderOrder = 1;
        boxGroup.add(boxWalls);

        // Каркас (EdgesGeometry)
        const edgesGeo = new THREE.EdgesGeometry(boxGeo);
        const edgesMat = new THREE.LineBasicMaterial({
            color: '#aaccff',
            transparent: true,
            opacity: 0.7,
            depthTest: true,
            depthWrite: true,
        });
        const boxEdges = new THREE.LineSegments(edgesGeo, edgesMat);
        boxEdges.position.y = BOX_CENTER_Y;
        boxEdges.name = 'boxEdges';
        boxEdges.renderOrder = 2;
        boxGroup.add(boxEdges);

        // Угловые маркеры (маленькие сферы на углах)
        const cornerMarkerGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const cornerMarkerMat = new THREE.MeshStandardMaterial({ color: '#aaccff', emissive: '#4466aa', emissiveIntensity: 0.8,
            roughness: 0.3 });
        const corners = [
            [-BOX_HALF, 0, -BOX_HALF],
            [BOX_HALF, 0, -BOX_HALF],
            [-BOX_HALF, 0, BOX_HALF],
            [BOX_HALF, 0, BOX_HALF],
            [-BOX_HALF, BOX_SIZE, -BOX_HALF],
            [BOX_HALF, BOX_SIZE, -BOX_HALF],
            [-BOX_HALF, BOX_SIZE, BOX_HALF],
            [BOX_HALF, BOX_SIZE, BOX_HALF],
        ];
        corners.forEach(([cx, cy, cz]) => {
            const marker = new THREE.Mesh(cornerMarkerGeo, cornerMarkerMat);
            marker.position.set(cx, cy, cz);
            marker.name = 'cornerMarker';
            boxGroup.add(marker);
        });

        scene.add(boxGroup);

        // ─────────────────────────────────────
        // Управление объектами
        // ─────────────────────────────────────
        const draggableObjects = []; // Массив 3D-объектов для DragControls
        const allItems = []; // Метаданные: { mesh, type, volume, halfW, halfD, baseY }

        let currentDragControls = null;

        /**
         * Создаёт 3D-объект предмета по типу
         */
        function createItemMesh(type) {
            const spec = ITEM_SPECS[type];
            const geo = new THREE.BoxGeometry(spec.w, spec.h, spec.d);
            const mat = new THREE.MeshStandardMaterial({
                color: spec.color,
                roughness: 0.45,
                metalness: 0.08,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.name = `item-${type}`;

            // Сохраняем данные в userData
            mesh.userData = {
                itemType: type,
                halfWidth: spec.w / 2,
                halfDepth: spec.d / 2,
                halfHeight: spec.h / 2,
                baseY: spec.h / 2, // Высота центра над полом
                volume: spec.volume,
                spec: spec,
            };

            return mesh;
        }

        /**
         * Генерирует случайную позицию внутри бокса для нового объекта
         */
        function getRandomPositionInBox(halfW, halfD, baseY) {
            const margin = 0.08;
            const rangeX = BOX_HALF - halfW - margin;
            const rangeZ = BOX_HALF - halfD - margin;
            const x = (Math.random() * 2 - 1) * Math.max(0, rangeX);
            const z = (Math.random() * 2 - 1) * Math.max(0, rangeZ);
            return new THREE.Vector3(x, baseY, z);
        }

        /**
         * Проверяет и ограничивает позицию объекта границами бокса
         */
        function clampPosition(obj) {
            const ud = obj.userData;
            if (!ud || ud.baseY === undefined) return;
            const halfW = ud.halfWidth;
            const halfD = ud.halfDepth;
            const baseY = ud.baseY;

            obj.position.y = baseY;
            obj.position.x = Math.max(-BOX_HALF + halfW, Math.min(BOX_HALF - halfW, obj.position.x));
            obj.position.z = Math.max(-BOX_HALF + halfD, Math.min(BOX_HALF - halfD, obj.position.z));
        }

        /**
         * Добавляет предмет на сцену
         */
        function addItem(type) {
            const mesh = createItemMesh(type);
            const pos = getRandomPositionInBox(mesh.userData.halfWidth, mesh.userData.halfDepth, mesh.userData.baseY);
            mesh.position.copy(pos);
            scene.add(mesh);

            draggableObjects.push(mesh);
            allItems.push({
                mesh,
                type,
                volume: mesh.userData.volume,
                halfW: mesh.userData.halfWidth,
                halfD: mesh.userData.halfDepth,
                baseY: mesh.userData.baseY,
            });

            rebuildDragControls();
            updateDashboard();
        }

        /**
         * Очищает сцену от всех добавленных предметов
         */
        function clearAllItems() {
            // Удаляем со сцены и освобождаем память
            for (const item of allItems) {
                const mesh = item.mesh;
                if (mesh.geometry) mesh.geometry.dispose();
                if (mesh.material) mesh.material.dispose();
                scene.remove(mesh);
            }
            draggableObjects.length = 0;
            allItems.length = 0;
            rebuildDragControls();
            updateDashboard();
        }

        /**
         * Пересоздаёт DragControls с актуальным списком объектов
         */
        function rebuildDragControls() {
            // Уничтожаем старый DragControls
            if (currentDragControls) {
                currentDragControls.dispose();
                currentDragControls = null;
            }

            if (draggableObjects.length === 0) return;

            // Создаём новый DragControls
            currentDragControls = new DragControls(draggableObjects, camera, renderer.domElement);

            // Ограничение перемещения плоскостью XZ + границы бокса
            currentDragControls.addEventListener('drag', (event) => {
                clampPosition(event.object);
                updateDashboard();
            });

            // Подсветка при наведении
            currentDragControls.addEventListener('hoveron', (event) => {
                const obj = event.object;
                if (obj.material && obj.material.emissive) {
                    obj.material._prevEmissive = obj.material.emissive.getHex();
                    obj.material._prevEmissiveIntensity = obj.material.emissiveIntensity;
                    obj.material.emissive = new THREE.Color('#444444');
                    obj.material.emissiveIntensity = 0.7;
                }
                document.body.style.cursor = 'grab';
            });

            currentDragControls.addEventListener('hoveroff', (event) => {
                const obj = event.object;
                if (obj.material && obj.material._prevEmissive !== undefined) {
                    obj.material.emissive = new THREE.Color(obj.material._prevEmissive);
                    obj.material.emissiveIntensity = obj.material._prevEmissiveIntensity || 0;
                    delete obj.material._prevEmissive;
                    delete obj.material._prevEmissiveIntensity;
                }
                document.body.style.cursor = '';
            });

            currentDragControls.addEventListener('dragstart', () => {
                document.body.style.cursor = 'grabbing';
            });

            currentDragControls.addEventListener('dragend', () => {
                document.body.style.cursor = '';
                // Финальная проверка позиции
                if (currentDragControls) {
                    draggableObjects.forEach(obj => clampPosition(obj));
                }
                updateDashboard();
            });
        }

        // ─────────────────────────────────────
        // Дашборд: расчёт и обновление UI
        // ─────────────────────────────────────
        function updateDashboard() {
            const count = allItems.length;
            const totalVolume = allItems.reduce((sum, item) => sum + item.volume, 0);

            // Определяем рекомендованный бокс
            let recommendedBox = null;
            let fillPercent = 0;
            let isOversize = false;

            for (const box of BOX_RECOMMENDATIONS) {
                if (totalVolume <= box.volume) {
                    recommendedBox = box;
                    fillPercent = (totalVolume / box.volume) * 100;
                    break;
                }
            }

            if (!recommendedBox) {
                // Превышает максимальный бокс L
                isOversize = true;
                recommendedBox = BOX_RECOMMENDATIONS[BOX_RECOMMENDATIONS.length - 1]; // L
                fillPercent = Math.min(100, (totalVolume / recommendedBox.volume) * 100);
            }

            // Обновляем DOM
            document.getElementById('metric-count').textContent = count;
            document.getElementById('metric-volume').textContent = totalVolume.toFixed(3) + ' м³';

            const fillBar = document.getElementById('fill-bar');
            const fillPercentEl = document.getElementById('metric-fill-percent');
            const badgeEl = document.getElementById('badge-recommend');
            const priceEl = document.getElementById('metric-price');
            const warningContainer = document.getElementById('warning-container');

            if (isOversize) {
                fillBar.style.width = '100%';
                fillBar.className = 'fill-bar-fill danger';
                fillPercentEl.textContent = '>100%';
                badgeEl.textContent = '⚠ Нестандартный';
                badgeEl.className = 'badge-recommend oversize';
                priceEl.textContent = 'По запросу';
                warningContainer.innerHTML =
                    '<p class="warning-text">Вам нужен складской комплекс или нестандартный бокс. Свяжитесь с нами для индивидуального расчёта.</p>';
            } else {
                fillBar.style.width = Math.max(1, fillPercent).toFixed(1) + '%';
                if (fillPercent > 85) {
                    fillBar.className = 'fill-bar-fill warning';
                } else {
                    fillBar.className = 'fill-bar-fill';
                }
                fillPercentEl.textContent = fillPercent.toFixed(1) + '%';
                badgeEl.textContent = `Бокс ${recommendedBox.name} (${recommendedBox.dims})`;
                badgeEl.className = 'badge-recommend';
                priceEl.textContent = recommendedBox.price.toLocaleString('ru-RU') + ' ₽';
                warningContainer.innerHTML = '';
            }
        }

        // ─────────────────────────────────────
        // Обработчики UI
        // ─────────────────────────────────────
        document.querySelectorAll('.btn-add-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.getAttribute('data-type');
                if (type && ITEM_SPECS[type]) {
                    addItem(type);
                }
            });
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            clearAllItems();
        });

        // Горячие клавиши
        window.addEventListener('keydown', (e) => {
            switch (e.key.toLowerCase()) {
                case '1':
                    addItem('box');
                    break;
                case '2':
                    addItem('sofa');
                    break;
                case '3':
                    addItem('bike');
                    break;
                case '4':
                    addItem('fridge');
                    break;
                case 'c':
                    if (!e.ctrlKey && !e.metaKey) clearAllItems();
                    break;
                default:
                    break;
            }
        });

        // ─────────────────────────────────────
        // Анимационный цикл
        // ─────────────────────────────────────
        function animate() {
            requestAnimationFrame(animate);

            orbitControls.update();

            // Лёгкое "дыхание" угловых маркеров бокса
            const time = performance.now() * 0.001;
            const markers = boxGroup.children.filter(c => c.name === 'cornerMarker');
            const pulse = 1 + Math.sin(time * 2.5) * 0.25;
            markers.forEach(m => {
                m.scale.setScalar(pulse);
            });

            renderer.render(scene, camera);
        }

        // ─────────────────────────────────────
        // Resize handler
        // ─────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ─────────────────────────────────────
        // Старт
        // ─────────────────────────────────────
        // Инициализируем пустой DragControls (будет пересоздан при добавлении объектов)
        rebuildDragControls();
        updateDashboard();
        animate();

        // Добавляем пару демо-предметов для наглядности
        setTimeout(() => {
            addItem('box');
            setTimeout(() => addItem('sofa'), 250);
            setTimeout(() => addItem('bike'), 500);
        }, 400);

        console.log('🚀 CodeForge 3D Self-Storage Calculator готов!');
        console.log('🖱 Перетаскивайте объекты мышью | 🔄 Вращайте сцену (колесо/правая кнопка)');
        console.log('⌨ Горячие клавиши: 1-Коробка 2-Диван 3-Велосипед 4-Холодильник C-Очистить');
    </script>
</body>
